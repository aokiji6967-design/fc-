name: Build

on:
  push:
  workflow_dispatch:   # lets you press "Run workflow" manually in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The repo has no Gradle wrapper, so install Gradle explicitly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fireclient-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
